<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2015 Model S 85D Pack Repair Log</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --orange: #db6d28;
  --blue: #58a6ff;
  --accent: #1f6feb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 12px;
}
header {
  text-align: center;
  padding: 16px 8px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
h1 { font-size: 1.4rem; margin: 0 0 4px; }
.subtitle { color: var(--muted); font-size: 0.9rem; }
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin: 12px 0 20px;
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 8px 0;
  z-index: 10;
}
nav button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  cursor: pointer;
}
nav button.active, nav button:hover {
  background: var(--accent);
  border-color: var(--accent);
}
.section { display: none; }
.section.active { display: block; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 14px;
}
h2 { font-size: 1.15rem; margin: 0 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
h3 { font-size: 1rem; margin: 12px 0 8px; }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 6px;
}
.stat {
  background: #21262d;
  border-radius: 4px;
  padding: 6px 4px;
  text-align: center;
}
.stat .value { font-size: 1.05rem; font-weight: 600; color: var(--blue); line-height: 1.2; }
.stat .label { font-size: 0.65rem; color: var(--muted); line-height: 1.1; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  margin: 8px 0;
}
th, td {
  border: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
}
th { background: #21262d; }
.flag-flat { color: var(--green); }
.flag-low { color: var(--orange); }
.flag-high { color: var(--red); font-weight: 600; }
.pass { color: var(--green); font-weight: 600; }
.fail { color: var(--red); font-weight: 600; }
.pending { color: var(--muted); }
.ok { color: var(--green); }
.issue { color: var(--orange); }
.progress {
  background: #21262d;
  border-radius: 4px;
  height: 20px;
  margin: 8px 0;
  overflow: hidden;
}
.progress-bar {
  background: var(--green);
  height: 100%;
  width: 25%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #000;
}
.highlight {
  background: #3d2200;
  border-left: 4px solid var(--orange);
  padding: 10px;
  border-radius: 4px;
  margin: 12px 0;
}
.timeline-item {
  border-left: 2px solid var(--border);
  padding-left: 12px;
  margin-bottom: 12px;
  position: relative;
}
.timeline-item::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 6px;
  width: 10px;
  height: 10px;
  background: var(--blue);
  border-radius: 50%;
}
.module-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 12px 0;
}
.module-cell {
  background: #21262d;
  border-radius: 4px;
  padding: 8px 4px;
  text-align: center;
  font-size: 0.75rem;
}
.module-cell.flat { border-bottom: 3px solid var(--green); }
.module-cell.low { border-bottom: 3px solid var(--orange); }
.wire-box {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin: 0 1px 0 3px;
  vertical-align: middle;
  border: 1px solid rgba(255,255,255,0.15);
}
.wire-red { background: #f85149; }
.wire-yellow { background: #e3b341; }
.wire-blue { background: #58a6ff; }
.wire-black { background: #484f58; }
.wire-orange { background: #db6d28; }
.wire-green { background: #3fb950; }
.wire-brown { background: #a3712e; }
.wire-status {
  font-size: 0.7rem;
  font-weight: 600;
  margin-right: 4px;
  vertical-align: middle;
}
.wire-cell {
  white-space: nowrap;
  font-size: 0.75rem;
  line-height: 1.4;
}
.bms-box {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: #8b949e;
  margin-right: 4px;
  vertical-align: middle;
  border: 1px solid rgba(255,255,255,0.15);
}
.pages-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}
.page-card {
  background: #21262d;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  text-decoration: none;
  color: var(--text);
  display: block;
  transition: border-color 0.15s;
}
.page-card:hover {
  border-color: var(--accent);
}
/* truncated for length - full content follows in actual call */
</style>
</head>
